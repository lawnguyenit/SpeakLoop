[project]
name = "speakloop"
version = "0.1.0"
description = "Evaluation-first pronunciation learning experiments"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
speakloop = "speakloop.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
asr = ["faster-whisper>=1.1,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speakloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
