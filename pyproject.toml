[project]
name = "speakloop"
version = "0.1.0"
description = "Evaluation-first pronunciation learning experiments"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.12,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
speakloop = "speakloop.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]
asr = [
    "av>=11,<17",
    "faster-whisper>=1.1,<2",
]
phonetic = [
    "numpy>=2,<3",
    "safetensors>=0.5,<1",
    "torch>=2.6,<3",
    "transformers>=4.50,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speakloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
